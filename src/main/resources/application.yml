spring:
  application:
    name: bag-mes-mybatis-plus
  datasource:
    url: jdbc:mysql://localhost:${MES_DB_PORT:3307}/bag_mes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MES_DB_USERNAME:root}
    password: ${MES_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8090
